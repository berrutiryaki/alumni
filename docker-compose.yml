services:

  db:
    image: postgres:16-alpine
    container_name: alumni_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: alumni_db
      POSTGRES_USER: alumni_user
      POSTGRES_PASSWORD: alumni_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: alumni_web
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://alumni_user:alumni_password@db:5432/alumni_db
      FLASK_ENV: development
      FLASK_DEBUG: 1
    depends_on:
      - db
    volumes:
      - alumni_data:/app/data
    restart: unless-stopped

volumes:
  alumni_data:
  postgres_data:
