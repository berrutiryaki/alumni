<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Announcement #{{ announcement.id }} — Alumni Platform</title>
    {% include 'partials/head.html' %}
</head>
<body>
    {% set active = 'announcements' %}
    {% include 'partials/nav.html' %}

    <section class="band-dark page-hero" style="padding-bottom: 40px;">
        <div class="orb orb-a"></div>
        <div class="container">
            <div class="breadcrumb-bar">
                <a href="/announcements">Announcements</a>
                <span>&rsaquo;</span>
                <span>Edit #{{ announcement.id }}</span>
            </div>
            <h1 class="display-md">Edit <span class="accent">announcement</span>.</h1>
            <p class="lead" style="margin-top: 12px;">{{ announcement.title }}</p>
        </div>
    </section>

    <section class="band band-light" style="padding-top: 56px;">
        <div class="container">
            <div class="form-shell">
                {% if error %}
                <div class="error-banner">{{ error }}</div>
                {% endif %}

                <form action="/announcements/{{ announcement.id }}/edit" method="POST">
                    <div class="field">
                        <label for="title">Headline / Title <span class="req">*</span></label>
                        <input type="text" id="title" name="title" class="input-pill" value="{{ announcement.title }}" required>
                    </div>

                    <div class="field">
                        <label for="content">Announcement Content <span class="req">*</span></label>
                        <textarea id="content" name="content" class="textarea-pill" required>{{ announcement.content }}</textarea>
                    </div>

                    <div class="form-grid-2">
                        <div class="field">
                            <label for="author">Author / Organization <span class="hint">(optional)</span></label>
                            <input type="text" id="author" name="author" class="input-pill" value="{{ announcement.author or '' }}">
                        </div>

                        <div class="field">
                            <label for="is_active">Visibility Status</label>
                            <select id="is_active" name="is_active" class="select-pill">
                                <option value="true" {% if announcement.is_active %}selected{% endif %}>Active — Visible on feed</option>
                                <option value="false" {% if not announcement.is_active %}selected{% endif %}>Inactive — Archived</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-sprout btn-lg">Save changes</button>
                        <a href="/announcements" class="btn btn-outline btn-lg">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </section>

    {% include 'partials/footer.html' %}
</body>
</html>
