<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Job Application - Alumni Platform</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background-color: #f8f9fa; color: #333; }
        .navbar { background-color: #212529; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .navbar a { color: #adb5bd; text-decoration: none; margin-right: 20px; font-weight: 500; font-size: 15px; }
        .navbar a:hover, .navbar a.active { color: white; }
        .navbar .brand { font-size: 18px; font-weight: bold; color: white; margin-right: 30px; }
        .container { max-width: 650px; margin: 30px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; color: #495057; }
        input[type="text"], input[type="url"], textarea, select { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ced4da; border-radius: 4px; font-size: 14px; font-family: inherit; }
        textarea { height: 130px; resize: vertical; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #86b7fe; box-shadow: 0 0 0 3px rgba(13,110,253,0.15); }
        button { padding: 10px 18px; background-color: #0d6efd; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 500; }
        button:hover { background-color: #0b5ed7; }
        .back-link { margin-top: 20px; display: inline-block; color: #6c757d; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #0d6efd; }
        .error-box { background-color: #f8d7da; color: #842029; border: 1px solid #f5c2c7; padding: 12px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div>
            <span class="brand">Alumni Platform</span>
            <a href="/users">Users</a>
            <a href="/announcements">Announcements</a>
            <a href="/job-postings">Job Postings</a>
            <a href="/applications" class="active">Applications</a>
            <a href="/api/swagger" target="_blank">Swagger API</a>
        </div>
    </nav>

    <div class="container">
        <h2 style="margin-top: 0;">Submit Job Application</h2>

        {% if error %}
        <div class="error-box">{{ error }}</div>
        {% endif %}

        <form action="/applications" method="POST">
            <div class="form-group">
                <label for="user_id">Applicant (User) *</label>
                <select id="user_id" name="user_id" required>
                    <option value="">-- Select Candidate --</option>
                    {% for u in users %}
                    <option value="{{ u.id }}">{{ u.name }} ({{ u.email }}) [{{ u.status }}]</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="job_posting_id">Target Job Position *</label>
                <select id="job_posting_id" name="job_posting_id" required>
                    <option value="">-- Select Job Posting --</option>
                    {% for j in job_postings %}
                    <option value="{{ j.id }}">{{ j.title }} — {{ j.company }} ({{ j.employment_type }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="resume_url">Resume / CV Link</label>
                <input type="url" id="resume_url" name="resume_url" placeholder="https://linkedin.com/in/... or drive link">
            </div>

            <div class="form-group">
                <label for="cover_letter">Cover Letter / Note</label>
                <textarea id="cover_letter" name="cover_letter" placeholder="Why are you a good fit for this role?"></textarea>
            </div>

            <div class="form-group">
                <label for="status">Initial Status</label>
                <select id="status" name="status">
                    <option value="pending" selected>Pending</option>
                    <option value="reviewed">Reviewed</option>
                    <option value="accepted">Accepted</option>
                    <option value="rejected">Rejected</option>
                </select>
            </div>

            <button type="submit">Submit Application</button>
        </form>

        <a href="/applications" class="back-link">← Back to Applications</a>
    </div>
</body>
</html>
