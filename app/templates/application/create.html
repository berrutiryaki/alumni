<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Application — Alumni Platform</title>
    {% include 'partials/head.html' %}
</head>
<body>
    {% set active = 'applications' %}
    {% include 'partials/nav.html' %}

    <section class="band-dark page-hero" style="padding-bottom: 40px;">
        <div class="orb orb-a"></div>
        <div class="container">
            <div class="breadcrumb-bar">
                <a href="/applications">Applications</a>
                <span>&rsaquo;</span>
                <span>Submit application</span>
            </div>
            <h1 class="display-md">Submit an <span class="accent">application</span>.</h1>
            <p class="lead" style="margin-top: 12px;">Link a candidate profile to an open job posting.</p>
        </div>
    </section>

    <section class="band band-light" style="padding-top: 56px;">
        <div class="container">
            <div class="form-shell">
                {% if error %}
                <div class="error-banner">{{ error }}</div>
                {% endif %}

                <form action="/applications" method="POST">
                    <div class="field">
                        <label for="user_id">Applicant (User) <span class="req">*</span></label>
                        <select id="user_id" name="user_id" class="select-pill" required>
                            <option value="">— Select Candidate —</option>
                            {% for u in users %}
                            <option value="{{ u.id }}" {% if current_user and current_user.id == u.id %}selected{% endif %}>{{ u.name }} &middot; {{ u.email }} ({{ u.role or u.status }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="field">
                        <label for="job_posting_id">Target Job Position <span class="req">*</span></label>
                        <select id="job_posting_id" name="job_posting_id" class="select-pill" required>
                            <option value="">— Select Job Posting —</option>
                            {% for j in job_postings %}
                            <option value="{{ j.id }}">{{ j.title }} — {{ j.company }} ({{ j.employment_type }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-grid-2">
                        <div class="field">
                            <label for="resume_url">Resume / CV Link <span class="hint">(optional)</span></label>
                            <input type="url" id="resume_url" name="resume_url" class="input-pill" placeholder="https://linkedin.com/in/...">
                        </div>

                        <div class="field">
                            <label for="status">Initial Status</label>
                            <select id="status" name="status" class="select-pill">
                                <option value="pending" selected>Pending</option>
                                <option value="reviewed">Reviewed</option>
                                <option value="accepted">Accepted</option>
                                <option value="rejected">Rejected</option>
                            </select>
                        </div>
                    </div>

                    <div class="field">
                        <label for="cover_letter">Cover Letter / Note <span class="hint">(optional)</span></label>
                        <textarea id="cover_letter" name="cover_letter" class="textarea-pill" placeholder="Why is this candidate a strong match for this role?"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-sprout btn-lg">Submit application</button>
                        <a href="/applications" class="btn btn-outline btn-lg">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </section>

    {% include 'partials/footer.html' %}

    <script>
        const params = new URLSearchParams(window.location.search);
        const preJobId = params.get('job_posting_id');
        if (preJobId) {
            const sel = document.getElementById('job_posting_id');
            if (sel) sel.value = preJobId;
        }
    </script>
</body>
</html>
