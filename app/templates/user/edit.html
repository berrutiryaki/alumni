<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="email"], input[type="number"] { width: 100%; max-width: 400px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .back-link { margin-top: 20px; display: inline-block; }
        .error { color: red; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Edit User #{{ user.id }}</h1>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form action="/users/{{ user.id }}/edit" method="POST">
        <div class="form-group">
            <label for="name">Full Name *</label>
            <input type="text" id="name" name="name" value="{{ user.name }}" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email" name="email" value="{{ user.email }}" required>
        </div>

        <div class="form-group">
            <label for="status">Status *</label>
            <select id="status" name="status" onchange="toggleGradYear()" required>
                <option value="student" {% if user.status == 'student' %}selected{% endif %}>Student</option>
                <option value="alumni" {% if user.status == 'alumni' %}selected{% endif %}>Alumni</option>
            </select>
        </div>

        <div class="form-group">
            <label for="department">Department</label>
            <input type="text" id="department" name="department" value="{{ user.department or '' }}">
        </div>

        <div class="form-group" id="grad_year_group" style="{% if user.status != 'alumni' %}display: none;{% endif %}">
            <label for="graduation_year">Graduation Year</label>
            <input type="number" id="graduation_year" name="graduation_year" value="{{ user.graduation_year or '' }}" min="1900" max="2100">
        </div>

        <button type="submit">Update User</button>
    </form>

    <a href="/users" class="back-link">← Back to list</a>

    <script>
        function toggleGradYear() {
            const status = document.getElementById('status').value;
            const gradYearGroup = document.getElementById('grad_year_group');
            if (status === 'alumni') {
                gradYearGroup.style.display = 'block';
            } else {
                gradYearGroup.style.display = 'none';
                document.getElementById('graduation_year').value = '';
            }
        }
    </script>
</body>
</html>
