<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit User - Alumni Platform</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background-color: #f8f9fa; color: #333; }
        .navbar { background-color: #212529; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .navbar a { color: #adb5bd; text-decoration: none; margin-right: 20px; font-weight: 500; font-size: 15px; }
        .navbar a:hover, .navbar a.active { color: white; }
        .navbar .brand { font-size: 18px; font-weight: bold; color: white; margin-right: 30px; }
        .container { max-width: 600px; margin: 30px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; color: #495057; }
        input[type="text"], input[type="email"], input[type="number"], select { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ced4da; border-radius: 4px; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #86b7fe; box-shadow: 0 0 0 3px rgba(13,110,253,0.15); }
        button { padding: 10px 18px; background-color: #0d6efd; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 500; }
        button:hover { background-color: #0b5ed7; }
        .back-link { margin-top: 20px; display: inline-block; color: #6c757d; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #0d6efd; }
        .error-box { background-color: #f8d7da; color: #842029; border: 1px solid #f5c2c7; padding: 12px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div>
            <span class="brand">Alumni Platform</span>
            <a href="/users" class="active">Users</a>
            <a href="/announcements">Announcements</a>
            <a href="/api/swagger" target="_blank">Swagger API</a>
        </div>
    </nav>

    <div class="container">
        <h2 style="margin-top: 0;">Edit User #{{ user.id }}</h2>

        {% if error %}
        <div class="error-box">{{ error }}</div>
        {% endif %}

        <form action="/users/{{ user.id }}/edit" method="POST">
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" value="{{ user.name }}" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" value="{{ user.email }}" required>
            </div>

            <div class="form-group">
                <label for="status">Status *</label>
                <select id="status" name="status" onchange="toggleGradYear()" required>
                    <option value="student" {% if user.status == 'student' %}selected{% endif %}>Student</option>
                    <option value="alumni" {% if user.status == 'alumni' %}selected{% endif %}>Alumni</option>
                </select>
            </div>

            <div class="form-group">
                <label for="department">Department</label>
                <input type="text" id="department" name="department" value="{{ user.department or '' }}">
            </div>

            <div class="form-group" id="grad_year_group" style="{% if user.status != 'alumni' %}display: none;{% endif %}">
                <label for="graduation_year">Graduation Year</label>
                <input type="number" id="graduation_year" name="graduation_year" value="{{ user.graduation_year or '' }}" min="1900" max="2100">
            </div>

            <button type="submit">Update in Database</button>
        </form>

        <a href="/users" class="back-link">← Back to Users list</a>
    </div>

    <script>
        function toggleGradYear() {
            const status = document.getElementById('status').value;
            const gradYearGroup = document.getElementById('grad_year_group');
            if (status === 'alumni') {
                gradYearGroup.style.display = 'block';
            } else {
                gradYearGroup.style.display = 'none';
                document.getElementById('graduation_year').value = '';
            }
        }
    </script>
</body>
</html>
