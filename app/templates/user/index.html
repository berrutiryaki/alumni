<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Users List</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        table { border-collapse: collapse; width: 100%; max-width: 800px; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        .btn { padding: 8px 12px; text-decoration: none; background-color: #007bff; color: white; border-radius: 4px; }
        .actions { margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>Alumni Users</h1>
    
    <div class="actions">
        <a href="/users/new" class="btn">+ Create New User</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Status</th>
                <th>Department</th>
                <th>Graduation Year</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.name }}</td>
                <td>{{ user.email }}</td>
                <td><span style="padding: 2px 6px; border-radius: 4px; background-color: {% if user.status == 'alumni' %}#d4edda{% else %}#cce5ff{% endif %}; color: {% if user.status == 'alumni' %}#155724{% else %}#004085{% endif %};">{{ user.status | capitalize }}</span></td>
                <td>{{ user.department or '-' }}</td>
                <td>{{ user.graduation_year or '-' }}</td>
                <td>
                    <a href="/users/{{ user.id }}/edit" class="btn" style="background-color: #ffc107; color: black; padding: 4px 8px;">Edit</a>
                    <form action="/users/{{ user.id }}/delete" method="POST" style="display:inline;">
                        <button type="submit" class="btn" style="background-color: #dc3545; padding: 4px 8px;" onclick="return confirm('Are you sure?')">Delete</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="6" style="text-align: center;">No users found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
