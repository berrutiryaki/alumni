<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create User</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="email"], input[type="number"] { width: 100%; max-width: 400px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
        .back-link { margin-top: 20px; display: inline-block; }
        .error { color: red; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Create New User</h1>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form action="/users" method="POST">
        <div class="form-group">
            <label for="name">Full Name *</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="status">Status *</label>
            <select id="status" name="status" onchange="toggleGradYear()" required>
                <option value="student" selected>Student</option>
                <option value="alumni">Alumni</option>
            </select>
        </div>

        <div class="form-group">
            <label for="department">Department</label>
            <input type="text" id="department" name="department">
        </div>

        <div class="form-group" id="grad_year_group" style="display: none;">
            <label for="graduation_year">Graduation Year</label>
            <input type="number" id="graduation_year" name="graduation_year" min="1900" max="2100">
        </div>

        <button type="submit">Save User</button>
    </form>

    <a href="/users" class="back-link">← Back to list</a>

    <script>
        function toggleGradYear() {
            const status = document.getElementById('status').value;
            const gradYearGroup = document.getElementById('grad_year_group');
            if (status === 'alumni') {
                gradYearGroup.style.display = 'block';
            } else {
                gradYearGroup.style.display = 'none';
                document.getElementById('graduation_year').value = ''; // Clear value
            }
        }
    </script>
</body>
</html>
