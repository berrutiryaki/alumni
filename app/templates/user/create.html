<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Member — Alumni Platform</title>
    {% include 'partials/head.html' %}
</head>
<body>
    {% set active = 'users' %}
    {% include 'partials/nav.html' %}

    <section class="band-dark page-hero" style="padding-bottom: 40px;">
        <div class="orb orb-a"></div>
        <div class="container">
            <div class="breadcrumb-bar">
                <a href="/users">Users</a>
                <span>&rsaquo;</span>
                <span>New member</span>
            </div>
            <h1 class="display-md">Add a new <span class="accent">member</span>.</h1>
            <p class="lead" style="margin-top: 12px;">Register a graduate or student profile in the university directory.</p>
        </div>
    </section>

    <section class="band band-light" style="padding-top: 56px;">
        <div class="container">
            <div class="form-shell">
                {% if error %}
                <div class="error-banner">{{ error }}</div>
                {% endif %}

                <form action="/users" method="POST">
                    <div class="field">
                        <label for="name">Full Name <span class="req">*</span></label>
                        <input type="text" id="name" name="name" class="input-pill" required placeholder="e.g. John Doe">
                    </div>

                    <div class="field">
                        <label for="email">Email Address <span class="req">*</span> <span class="hint">(must be unique)</span></label>
                        <input type="email" id="email" name="email" class="input-pill" required placeholder="e.g. john@example.com">
                    </div>

                    <div class="form-grid-2">
                        <div class="field">
                            <label for="status">Member Status <span class="req">*</span></label>
                            <select id="status" name="status" class="select-pill" onchange="toggleGradYear()" required>
                                <option value="student" selected>Student</option>
                                <option value="alumni">Alumni</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="department">Academic Department <span class="hint">(optional)</span></label>
                            <input type="text" id="department" name="department" class="input-pill" placeholder="e.g. Computer Engineering">
                        </div>
                    </div>

                    <div class="field" id="grad_year_group" style="display: none;">
                        <label for="graduation_year">Graduation Year <span class="hint">(for alumni)</span></label>
                        <input type="number" id="graduation_year" name="graduation_year" class="input-pill" min="1900" max="2100" placeholder="e.g. 2024">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-sprout btn-lg">Save member</button>
                        <a href="/users" class="btn btn-outline btn-lg">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </section>

    {% include 'partials/footer.html' %}

    <script>
        function toggleGradYear() {
            const status = document.getElementById('status').value;
            const gradYearGroup = document.getElementById('grad_year_group');
            if (status === 'alumni') {
                gradYearGroup.style.display = 'block';
            } else {
                gradYearGroup.style.display = 'none';
                document.getElementById('graduation_year').value = '';
            }
        }
    </script>
</body>
</html>
