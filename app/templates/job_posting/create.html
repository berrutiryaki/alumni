<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Job Posting - Alumni Platform</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; color: #1a1a2e; }

        .navbar { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 0 32px; display: flex; justify-content: space-between; align-items: center; height: 58px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .nav-left { display: flex; align-items: center; gap: 6px; }
        .navbar .brand { font-size: 17px; font-weight: 700; color: white; margin-right: 24px; letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; }
        .brand-icon { width: 28px; height: 28px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .navbar a { color: #94a3b8; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-weight: 500; font-size: 14px; transition: all 0.15s; }
        .navbar a:hover { color: white; background: rgba(255,255,255,0.08); }
        .navbar a.active { color: white; background: rgba(255,255,255,0.12); }

        .page-wrapper { max-width: 720px; margin: 36px auto; padding: 0 24px; }

        /* Breadcrumb */
        .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #64748b; margin-bottom: 20px; }
        .breadcrumb a { color: #667eea; text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }
        .breadcrumb-sep { color: #cbd5e1; }

        /* Form card */
        .form-card { background: white; border-radius: 14px; border: 1px solid #e8ecf0; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow: hidden; }
        .form-card-header { padding: 24px 28px 20px; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; gap: 14px; }
        .form-icon { width: 44px; height: 44px; background: linear-gradient(135deg, #667eea20, #764ba220); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .form-title { font-size: 19px; font-weight: 700; color: #0f172a; margin: 0 0 3px; }
        .form-subtitle { font-size: 13px; color: #64748b; margin: 0; }

        .form-body { padding: 28px; }
        .form-section { margin-bottom: 24px; }
        .section-title { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 14px; padding-bottom: 6px; border-bottom: 1px solid #f1f5f9; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; color: #374151; }
        .label-hint { font-weight: 400; color: #9ca3af; font-size: 12px; }
        .required { color: #ef4444; margin-left: 2px; }

        input[type="text"], input[type="url"], textarea, select {
            width: 100%; padding: 10px 12px; border: 1px solid #dde1e7; border-radius: 8px; font-size: 14px; font-family: inherit; color: #1e293b; background: #fafbfc; transition: all 0.15s;
        }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #667eea; background: white; box-shadow: 0 0 0 3px rgba(102,126,234,0.12); }
        textarea { height: 140px; resize: vertical; line-height: 1.6; }
        select { cursor: pointer; }

        .form-footer { padding: 20px 28px; background: #fafbfc; border-top: 1px solid #f1f5f9; display: flex; gap: 10px; align-items: center; }
        .btn-submit { padding: 11px 22px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.15s; }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102,126,234,0.45); }
        .btn-cancel { padding: 11px 18px; background: white; color: #64748b; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; transition: all 0.15s; }
        .btn-cancel:hover { background: #f8fafc; color: #374151; }

        .error-box { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; display: flex; gap: 8px; align-items: flex-start; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <span class="brand">
                <span class="brand-icon">🎓</span>
                Alumni Platform
            </span>
            <a href="/users">Users</a>
            <a href="/announcements">Announcements</a>
            <a href="/job-postings" class="active">Job Postings</a>
            <a href="/applications">Applications</a>
            <a href="/api/swagger" target="_blank">Swagger API</a>
        </div>
    </nav>

    <div class="page-wrapper">
        <div class="breadcrumb">
            <a href="/job-postings">Job Postings</a>
            <span class="breadcrumb-sep">›</span>
            New Posting
        </div>

        <div class="form-card">
            <div class="form-card-header">
                <div class="form-icon">💼</div>
                <div>
                    <div class="form-title">Publish Job Posting</div>
                    <div class="form-subtitle">Fill in the details to post a new job opportunity for alumni.</div>
                </div>
            </div>

            <form action="/job-postings" method="POST">
                <div class="form-body">

                    {% if error %}
                    <div class="error-box">⚠️ {{ error }}</div>
                    {% endif %}

                    <!-- Basic Info -->
                    <div class="form-section">
                        <div class="section-title">Basic Information</div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="title">Job Title <span class="required">*</span></label>
                                <input type="text" id="title" name="title" required placeholder="e.g. Backend Developer">
                            </div>
                            <div class="form-group">
                                <label for="company">Company / Organization <span class="required">*</span></label>
                                <input type="text" id="company" name="company" required placeholder="e.g. Trendyol">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="description">Job Description <span class="required">*</span></label>
                            <textarea id="description" name="description" required placeholder="Responsibilities, requirements, tech stack, and any other relevant details..."></textarea>
                        </div>
                    </div>

                    <!-- Details -->
                    <div class="form-section">
                        <div class="section-title">Position Details</div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="location">Location <span class="label-hint">(optional)</span></label>
                                <input type="text" id="location" name="location" placeholder="e.g. Istanbul / Remote">
                            </div>
                            <div class="form-group">
                                <label for="employment_type">Employment Type</label>
                                <select id="employment_type" name="employment_type">
                                    <option value="full-time">Full-time</option>
                                    <option value="part-time">Part-time</option>
                                    <option value="internship">Internship</option>
                                    <option value="contract">Contract</option>
                                    <option value="remote">Remote</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="salary_range">Salary Range <span class="label-hint">(optional)</span></label>
                                <input type="text" id="salary_range" name="salary_range" placeholder="e.g. ₺40,000 – ₺60,000 / mo">
                            </div>
                            <div class="form-group">
                                <label for="posted_by">Posted By <span class="label-hint">(optional)</span></label>
                                <input type="text" id="posted_by" name="posted_by" placeholder="e.g. Jane Doe (HR)">
                            </div>
                        </div>
                    </div>

                    <!-- Settings -->
                    <div class="form-section">
                        <div class="section-title">Listing Settings</div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="expires_at">Expiration Date <span class="label-hint">(optional)</span></label>
                                <input type="text" id="expires_at" name="expires_at" placeholder="YYYY-MM-DD">
                            </div>
                            <div class="form-group">
                                <label for="is_active">Listing Status</label>
                                <select id="is_active" name="is_active">
                                    <option value="true">✅ Active — Accepting Applications</option>
                                    <option value="false">🔒 Inactive — Closed</option>
                                </select>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="form-footer">
                    <button type="submit" class="btn-submit">✅ Publish Job Posting</button>
                    <a href="/job-postings" class="btn-cancel">← Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
