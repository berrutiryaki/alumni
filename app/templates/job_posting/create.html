<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job — Alumni Platform</title>
    {% include 'partials/head.html' %}
</head>
<body>
    {% set active = 'jobs' %}
    {% include 'partials/nav.html' %}

    <section class="band-dark page-hero" style="padding-bottom: 40px;">
        <div class="orb orb-a"></div>
        <div class="container">
            <div class="breadcrumb-bar">
                <a href="/job-postings">Job Postings</a>
                <span>&rsaquo;</span>
                <span>New job posting</span>
            </div>
            <h1 class="display-md">Publish a <span class="accent">role</span>.</h1>
            <p class="lead" style="margin-top: 12px;">Share an open position with graduates and students in the network.</p>
        </div>
    </section>

    <section class="band band-light" style="padding-top: 56px;">
        <div class="container">
            <div class="form-shell">
                {% if error %}
                <div class="error-banner">{{ error }}</div>
                {% endif %}

                <form action="/job-postings" method="POST">
                    <div class="form-grid-2">
                        <div class="field">
                            <label for="title">Job Title <span class="req">*</span> <span class="hint">(max 120 chars)</span></label>
                            <input type="text" id="title" name="title" class="input-pill" maxlength="120" required placeholder="e.g. Backend Developer">
                        </div>

                        <div class="field">
                            <label for="company">Company <span class="req">*</span> <span class="hint">(max 120 chars)</span></label>
                            <input type="text" id="company" name="company" class="input-pill" maxlength="120" required placeholder="e.g. Trendyol">
                        </div>
                    </div>

                    <div class="form-grid-2">
                        <div class="field">
                            <label for="employment_type">Employment Type <span class="req">*</span></label>
                            <select id="employment_type" name="employment_type" class="select-pill" required>
                                <option value="full-time" selected>Full-time</option>
                                <option value="part-time">Part-time</option>
                                <option value="internship">Internship</option>
                                <option value="contract">Contract</option>
                                <option value="remote">Remote</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="salary_range">Salary Range <span class="req">*</span></label>
                            <input type="text" id="salary_range" name="salary_range" class="input-pill" required placeholder="e.g. 50.000 - 70.000 TL">
                        </div>
                    </div>

                    <div class="form-grid-2">
                        <div class="field">
                            <label for="city">City <span class="hint">(optional, max 120 chars)</span></label>
                            <input type="text" id="city" name="city" class="input-pill" maxlength="120" placeholder="e.g. Istanbul / Hybrid">
                        </div>

                        <div class="field">
                            <label for="posted_by">Posted By <span class="hint">(defaults to your email)</span></label>
                            <input type="text" id="posted_by" name="posted_by" class="input-pill" value="{{ current_user.email if current_user else '' }}" placeholder="e.g. talent@company.com">
                        </div>
                    </div>

                    <div class="field">
                        <label for="description">Job Description <span class="hint">(optional)</span></label>
                        <textarea id="description" name="description" class="textarea-pill" placeholder="Responsibilities, requirements, tech stack and benefits..."></textarea>
                    </div>

                    <div class="form-grid-2">
                        <div class="field">
                            <label for="expires_at">Expiration Date <span class="hint">(optional)</span></label>
                            <input type="text" id="expires_at" name="expires_at" class="input-pill" placeholder="YYYY-MM-DD">
                        </div>

                        <div class="field">
                            <label for="is_active">Listing Status</label>
                            <select id="is_active" name="is_active" class="select-pill">
                                <option value="true" selected>Active — Accepting applications</option>
                                <option value="false">Inactive — Closed</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-sprout btn-lg">Publish job posting</button>
                        <a href="/job-postings" class="btn btn-outline btn-lg">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </section>

    {% include 'partials/footer.html' %}
</body>
</html>
