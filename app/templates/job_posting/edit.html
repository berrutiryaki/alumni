<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Job Posting #{{ job_posting.id }} — Alumni Platform</title>
    {% include 'partials/head.html' %}
</head>
<body>
    {% set active = 'jobs' %}
    {% include 'partials/nav.html' %}

    <section class="band-dark page-hero" style="padding-bottom: 40px;">
        <div class="orb orb-a"></div>
        <div class="container">
            <div class="breadcrumb-bar">
                <a href="/job-postings">Job Postings</a>
                <span>&rsaquo;</span>
                <span>Edit #{{ job_posting.id }}</span>
            </div>
            <h1 class="display-md">Edit <span class="accent">{{ job_posting.title }}</span>.</h1>
            <p class="lead" style="margin-top: 12px;">{{ job_posting.company }}</p>
        </div>
    </section>

    <section class="band band-light" style="padding-top: 56px;">
        <div class="container">
            <div class="form-shell">
                {% if error %}
                <div class="error-banner">{{ error }}</div>
                {% endif %}

                <form action="/job-postings/{{ job_posting.id }}/edit" method="POST">
                    <div class="form-grid-2">
                        <div class="field">
                            <label for="title">Job Title <span class="req">*</span> <span class="hint">(max 120 chars)</span></label>
                            <input type="text" id="title" name="title" class="input-pill" maxlength="120" required value="{{ job_posting.title }}">
                        </div>

                        <div class="field">
                            <label for="company">Company <span class="req">*</span> <span class="hint">(max 120 chars)</span></label>
                            <input type="text" id="company" name="company" class="input-pill" maxlength="120" required value="{{ job_posting.company }}">
                        </div>
                    </div>

                    <div class="form-grid-2">
                        <div class="field">
                            <label for="employment_type">Employment Type <span class="req">*</span></label>
                            <select id="employment_type" name="employment_type" class="select-pill" required>
                                <option value="full-time" {% if job_posting.employment_type == 'full-time' %}selected{% endif %}>Full-time</option>
                                <option value="part-time" {% if job_posting.employment_type == 'part-time' %}selected{% endif %}>Part-time</option>
                                <option value="internship" {% if job_posting.employment_type == 'internship' %}selected{% endif %}>Internship</option>
                                <option value="contract" {% if job_posting.employment_type == 'contract' %}selected{% endif %}>Contract</option>
                                <option value="remote" {% if job_posting.employment_type == 'remote' %}selected{% endif %}>Remote</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="salary_range">Salary Range <span class="req">*</span></label>
                            <input type="text" id="salary_range" name="salary_range" class="input-pill" required value="{{ job_posting.salary_range or '' }}">
                        </div>
                    </div>

                    <div class="form-grid-2">
                        <div class="field">
                            <label for="city">City <span class="hint">(optional, max 120 chars)</span></label>
                            <input type="text" id="city" name="city" class="input-pill" maxlength="120" value="{{ job_posting.city or job_posting.location or '' }}">
                        </div>

                        <div class="field">
                            <label for="posted_by">Posted By <span class="hint">(optional)</span></label>
                            <input type="text" id="posted_by" name="posted_by" value="{{ job_posting.posted_by or '' }}" class="input-pill">
                        </div>
                    </div>

                    <div class="field">
                        <label for="description">Job Description <span class="hint">(optional)</span></label>
                        <textarea id="description" name="description" class="textarea-pill">{{ job_posting.description or '' }}</textarea>
                    </div>

                    <div class="form-grid-2">
                        <div class="field">
                            <label for="expires_at">Expiration Date <span class="hint">(optional)</span></label>
                            <input type="text" id="expires_at" name="expires_at" class="input-pill" value="{{ job_posting.expires_at or '' }}" placeholder="YYYY-MM-DD">
                        </div>

                        <div class="field">
                            <label for="is_active">Listing Status</label>
                            <select id="is_active" name="is_active" class="select-pill">
                                <option value="true" {% if job_posting.is_active %}selected{% endif %}>Active — Accepting applications</option>
                                <option value="false" {% if not job_posting.is_active %}selected{% endif %}>Inactive — Closed</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-sprout btn-lg">Save changes</button>
                        <a href="/job-postings" class="btn btn-outline btn-lg">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </section>

    {% include 'partials/footer.html' %}
</body>
</html>
